<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIT 360 | Spatial World Explorer & Fact Engine</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow: hidden;
        }

        .font-space { font-family: 'Space Grotesk', sans-serif; }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-pill {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-modal {
            background: rgba(7, 12, 27, 0.95);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        .text-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #00d2ff 60%, #7000ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glow-cyan { box-shadow: 0 0 35px rgba(0, 210, 255, 0.35); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d2ff; }

        #canvas-container canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
        }
    </style>
</head>
<body class="h-full w-full select-none">

    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container" class="fixed inset-0 z-0 bg-slate-950"></div>

    <!-- UI Overlay Layout -->
    <div class="relative z-10 h-full w-full flex flex-col justify-between pointer-events-none p-4 md:p-6">

        <!-- Header / Navigation Bar -->
        <header class="flex items-center justify-between w-full max-w-7xl mx-auto pointer-events-auto">
            <div class="flex items-center gap-3 glass-pill px-4 py-2.5 rounded-full shadow-2xl">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center glow-cyan">
                    <i data-lucide="globe" class="w-4 h-4 text-white"></i>
                </div>
                <span class="font-space text-lg font-bold tracking-widest text-gradient">ORBIT 360</span>
                <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 uppercase tracking-widest hidden sm:inline-block">Spatial Engine</span>
            </div>

            <!-- Global Controls -->
            <div class="flex items-center gap-3">
                <div class="relative hidden md:block">
                    <input type="text" id="quick-search" oninput="handleSearch(this.value)" placeholder="Search any destination..." class="w-64 glass-pill px-4 py-2 pl-10 rounded-full text-xs text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400/50 transition-all pointer-events-auto">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-2.5"></i>
                    <div id="search-results" class="absolute top-12 left-0 right-0 glass-panel rounded-2xl p-2 hidden space-y-1 max-h-60 overflow-y-auto"></div>
                </div>

                <select id="currency-select" onchange="updateCurrency(this.value)" class="glass-pill px-3 py-2 rounded-full text-xs text-cyan-300 font-bold focus:outline-none cursor-pointer pointer-events-auto">
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="AUD">AUD ($)</option>
                    <option value="JPY">JPY (¥)</option>
                </select>

                <button onclick="toggleAutoRotate()" id="rotate-btn" class="glass-pill p-2.5 rounded-full text-slate-300 hover:text-white transition-colors pointer-events-auto" title="Toggle Auto Rotation">
                    <i data-lucide="pause" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- Floating Destination Dock -->
        <div class="w-full max-w-4xl mx-auto pointer-events-auto mb-2">
            <div class="glass-panel p-3 rounded-2xl border border-white/10 flex items-center gap-2 overflow-x-auto">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-2 shrink-0 flex items-center gap-1">
                    <i data-lucide="compass" class="w-3.5 h-3.5 text-cyan-400"></i> Destinations:
                </span>
                <div id="quick-dock" class="flex items-center gap-2"></div>
            </div>
        </div>
    </div>

    <!-- Slide-Out Destination Fact Drawer -->
    <aside id="fact-drawer" class="fixed top-0 right-0 bottom-0 z-50 w-full sm:w-[450px] glass-modal shadow-2xl transition-transform duration-500 transform translate-x-full flex flex-col">
        <button onclick="closeDrawer()" class="absolute top-5 right-5 z-20 p-2 glass-pill rounded-full text-slate-400 hover:text-white transition-colors">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <div class="h-full overflow-y-auto p-6 space-y-6">
            <div class="relative h-64 rounded-2xl overflow-hidden glass-panel border border-white/10 shrink-0">
                <img id="drawer-img" src="" alt="Destination" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
                <div class="absolute bottom-4 left-4 right-4 space-y-1">
                    <span id="drawer-country" class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-cyan-500/20 text-cyan-300 border border-cyan-500/30"></span>
                    <h2 id="drawer-title" class="font-space text-3xl font-bold text-white"></h2>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <div class="glass-panel p-3 rounded-xl text-center space-y-0.5">
                    <span class="text-[9px] uppercase font-bold text-slate-400">Est. Price</span>
                    <p id="drawer-price" class="text-xs font-black text-emerald-400"></p>
                </div>
                <div class="glass-panel p-3 rounded-xl text-center space-y-0.5">
                    <span class="text-[9px] uppercase font-bold text-slate-400">Currency</span>
                    <p id="drawer-currency" class="text-xs font-black text-cyan-300"></p>
                </div>
                <div class="glass-panel p-3 rounded-xl text-center space-y-0.5">
                    <span class="text-[9px] uppercase font-bold text-slate-400">Best Season</span>
                    <p id="drawer-season" class="text-xs font-black text-indigo-300"></p>
                </div>
            </div>

            <div class="space-y-2">
                <h4 class="text-xs uppercase font-extrabold text-cyan-400 tracking-wider flex items-center gap-1.5">
                    <i data-lucide="info" class="w-3.5 h-3.5"></i> Overview & Facts
                </h4>
                <p id="drawer-desc" class="text-slate-300 text-xs leading-relaxed font-light"></p>
            </div>

            <div class="glass-panel p-4 rounded-2xl border border-white/10 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                        <i data-lucide="cloud-sun" class="w-4 h-4 text-cyan-400"></i> Weather Radar
                    </span>
                    <span id="weather-temp" class="text-base font-black text-cyan-300">Loading...</span>
                </div>
                <p id="weather-cond" class="text-[11px] text-slate-400">Fetching satellite data...</p>
            </div>

            <div class="space-y-2.5">
                <h4 class="text-xs uppercase font-extrabold text-cyan-400 tracking-wider flex items-center gap-1.5">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Top Landmarks
                </h4>
                <div id="drawer-highlights" class="grid grid-cols-2 gap-2"></div>
            </div>

            <div class="pt-4 space-y-2.5 border-t border-white/10">
                <button id="btn-book-hotels" onclick="" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-extrabold text-xs uppercase tracking-wider transition-all transform hover:scale-[1.02] glow-cyan flex items-center justify-center gap-2">
                    <i data-lucide="building" class="w-4 h-4"></i> Book Hotels (Booking.com)
                </button>
                <button id="btn-book-flights" onclick="" class="w-full py-3.5 rounded-xl glass-panel hover:bg-white/10 text-slate-200 font-extrabold text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2 border border-white/10">
                    <i data-lucide="plane" class="w-4 h-4 text-cyan-400"></i> Search Flights (Skyscanner)
                </button>
            </div>
        </div>
    </aside>

    <!-- Booking Aggregator Modal -->
    <div id="booking-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md hidden">
        <div class="glass-modal max-w-md w-full rounded-3xl p-6 sm:p-8 space-y-6 relative border border-cyan-500/30">
            <button onclick="closeBookingModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div class="space-y-1">
                <span class="text-[10px] font-bold uppercase tracking-widest text-cyan-400">Live Partner Search</span>
                <h3 id="booking-modal-title" class="font-space text-2xl font-bold text-white">Plan Your Trip</h3>
            </div>
            <div class="space-y-3">
                <a id="link-booking-com" href="#" target="_blank" class="flex items-center justify-between p-4 rounded-2xl glass-panel hover:border-cyan-400/50 transition-all group">
                    <div class="flex items-center gap-3">
                        <i data-lucide="hotel" class="w-5 h-5 text-cyan-400"></i>
                        <div>
                            <div class="text-xs font-bold text-white">Booking.com</div>
                            <div class="text-[10px] text-slate-400">Hotels, Resorts & Apartments</div>
                        </div>
                    </div>
                    <i data-lucide="external-link" class="w-4 h-4 text-slate-400 group-hover:text-cyan-400"></i>
                </a>
                <a id="link-skyscanner" href="#" target="_blank" class="flex items-center justify-between p-4 rounded-2xl glass-panel hover:border-cyan-400/50 transition-all group">
                    <div class="flex items-center gap-3">
                        <i data-lucide="plane" class="w-5 h-5 text-indigo-400"></i>
                        <div>
                            <div class="text-xs font-bold text-white">Skyscanner</div>
                            <div class="text-[10px] text-slate-400">Compare Worldwide Flights</div>
                        </div>
                    </div>
                    <i data-lucide="external-link" class="w-4 h-4 text-slate-400 group-hover:text-cyan-400"></i>
                </a>
            </div>
        </div>
    </div>

    <!-- Application Script & Procedural 3D WebGL Engine -->
    <script>
        lucide.createIcons();

        // 16 Global Destinations Database
        const destinations = [
            { id: "tokyo", name: "Tokyo", country: "Japan", lat: 35.6762, lng: 139.6503, price: 190, img: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=800&q=80", desc: "A sprawling metropolis blending futuristic neon skyscrapers with historic Shinto shrines and world-leading dining.", currency: "JPY (¥)", season: "Spring (Cherry Blossom)", highlights: ["Shibuya Crossing", "Senso-ji Temple", "Tokyo Skytree", "Meiji Shrine"] },
            { id: "paris", name: "Paris", country: "France", lat: 48.8566, lng: 2.3522, price: 210, img: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=800&q=80", desc: "The global epicenter of fashion, fine art, and gastronomy, renowned for cafe culture and iconic romantic architecture.", currency: "EUR (€)", season: "Summer / Autumn", highlights: ["Eiffel Tower", "Louvre Museum", "Montmartre", "Arc de Triomphe"] },
            { id: "nyc", name: "New York", country: "United States", lat: 40.7128, lng: -74.0060, price: 240, img: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?auto=format&fit=crop&w=800&q=80", desc: "The bustling cultural capital of North America featuring Broadway theaters, vast urban parks, and iconic skylines.", currency: "USD ($)", season: "Spring / Autumn", highlights: ["Central Park", "Times Square", "Empire State", "Statue of Liberty"] },
            { id: "london", name: "London", country: "United Kingdom", lat: 51.5074, lng: -0.1278, price: 220, img: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=800&q=80", desc: "A historic financial powerhouse boasting royal palaces, world-class free museums, and vibrant theatre districts.", currency: "GBP (£)", season: "May - September", highlights: ["Tower of London", "British Museum", "Big Ben", "Buckingham Palace"] },
            { id: "rome", name: "Rome", country: "Italy", lat: 41.9028, lng: 12.4964, price: 170, img: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=800&q=80", desc: "An open-air museum housing nearly three millennia of globally influential art, Roman ruins, and authentic Italian pasta.", currency: "EUR (€)", season: "Autumn / Spring", highlights: ["The Colosseum", "Vatican City", "Trevi Fountain", "Pantheon"] },
            { id: "dubai", name: "Dubai", country: "United Arab Emirates", lat: 25.2048, lng: 55.2708, price: 230, img: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=800&q=80", desc: "A futuristic desert oasis known for ultra-luxury shopping, record-breaking skyscrapers, and pristine coastlines.", currency: "AED (د.إ)", season: "November - March", highlights: ["Burj Khalifa", "Palm Jumeirah", "Dubai Mall", "Desert Safari"] },
            { id: "sydney", name: "Sydney", country: "Australia", lat: -33.8688, lng: 151.2093, price: 200, img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80", desc: "Famous for its sweeping harbor views, architectural opera house, golden surfing beaches, and outdoor lifestyle.", currency: "AUD ($)", season: "Spring / Summer", highlights: ["Opera House", "Bondi Beach", "Harbour Bridge", "Manly Beach"] },
            { id: "rio", name: "Rio de Janeiro", country: "Brazil", lat: -22.9068, lng: -43.1729, price: 150, img: "https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?auto=format&fit=crop&w=800&q=80", desc: "A tropical paradise framed by steep granite peaks, golden beaches, samba rhythm, and lush rainforest reserves.", currency: "BRL (R$)", season: "December - March", highlights: ["Christ the Redeemer", "Sugarloaf Mountain", "Copacabana", "Tijuca Forest"] },
            { id: "cairo", name: "Cairo", country: "Egypt", lat: 30.0444, lng: 31.2357, price: 120, img: "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=800&q=80", desc: "Sprawling capital along the ancient Nile River, gateway to the Great Pyramids and ancient pharaonic civilizations.", currency: "EGP (E£)", season: "October - April", highlights: ["Giza Pyramids", "The Sphinx", "Egyptian Museum", "Khan el-Khalili"] },
            { id: "istanbul", name: "Istanbul", country: "Turkey", lat: 41.0082, lng: 28.9784, price: 135, img: "https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?auto=format&fit=crop&w=800&q=80", desc: "A transcontinental metropolis straddling Europe and Asia across the Bosphorus, rich with mosques and spice bazaars.", currency: "TRY (₺)", season: "April - May", highlights: ["Hagia Sophia", "Blue Mosque", "Grand Bazaar", "Topkapi Palace"] },
            { id: "capetown", name: "Cape Town", country: "South Africa", lat: -33.9249, lng: 18.4241, price: 145, img: "https://images.unsplash.com/photo-1580619305218-8544a191509c?auto=format&fit=crop&w=800&q=80", desc: "A dramatic harbor city anchored beneath Table Mountain, surrounded by coastal wine valleys and penguin colonies.", currency: "ZAR (R)", season: "November - March", highlights: ["Table Mountain", "Cape Point", "V&A Waterfront", "Boulders Beach"] },
            { id: "bangkok", name: "Bangkok", country: "Thailand", lat: 13.7563, lng: 100.5018, price: 110, img: "https://images.unsplash.com/photo-1508009603885-50cf7c579365?auto=format&fit=crop&w=800&q=80", desc: "A dynamic Southeast Asian capital celebrated for ornate Buddhist shrines, floating markets, and famous street food.", currency: "THB (฿)", season: "November - February", highlights: ["Grand Palace", "Wat Arun", "Floating Market", "Khao San Road"] },
            { id: "singapore", name: "Singapore", country: "Singapore", lat: 1.3521, lng: 103.8198, price: 250, img: "https://images.unsplash.com/photo-1525625293386-3f8f99389edd?auto=format&fit=crop&w=800&q=80", desc: "A futuristic island city-state featuring supertree gardens, luxury shopping malls, and diverse hawker food centers.", currency: "SGD ($)", season: "Year-Round", highlights: ["Gardens by the Bay", "Marina Bay Sands", "Sentosa Island", "Jewel Changi"] },
            { id: "barcelona", name: "Barcelona", country: "Spain", lat: 41.3851, lng: 2.1734, price: 165, img: "https://images.unsplash.com/photo-1539037116277-4db20889f2d4?auto=format&fit=crop&w=800&q=80", desc: "Cosmopolitan Mediterranean port city celebrated for Antoni Gaudí's whimsical architecture and beachside tapas bars.", currency: "EUR (€)", season: "May - June", highlights: ["Sagrada Família", "Park Güell", "Gothic Quarter", "La Barceloneta"] },
            { id: "reykjavik", name: "Reykjavik", country: "Iceland", lat: 64.1466, lng: -21.9426, price: 220, img: "https://images.unsplash.com/photo-1504893524553-eef25d3b6421?auto=format&fit=crop&w=800&q=80", desc: "The world's northernmost capital, gateway to Iceland's geothermal hot springs, cascading waterfalls, and Northern Lights.", currency: "ISK (kr)", season: "June - Aug / Winter", highlights: ["Blue Lagoon", "Golden Circle", "Hallgrímskirkja", "Northern Lights"] },
            { id: "vancouver", name: "Vancouver", country: "Canada", lat: 49.2827, lng: -123.1207, price: 195, img: "https://images.unsplash.com/photo-1559511260-66a654ae250c?auto=format&fit=crop&w=800&q=80", desc: "A scenic Pacific coastal metropolis in British Columbia surrounded by snow-capped mountains and ocean fjords.", currency: "CAD ($)", season: "June - August", highlights: ["Stanley Park", "Capilano Bridge", "Granville Island", "Whistler"] }
        ];

        // Currency Exchange
        const exchangeRates = { USD: 1.0, EUR: 0.92, GBP: 0.79, AUD: 1.52, JPY: 155.0 };
        const currencySymbols = { USD: '$', EUR: '€', GBP: '£', AUD: '$', JPY: '¥' };
        let currentCurrency = 'USD';

        function updateCurrency(val) {
            currentCurrency = val;
            if (window.activeDestId) openDrawer(window.activeDestId);
        }

        // Render Quick Selection Dock
        const dock = document.getElementById('quick-dock');
        destinations.forEach(d => {
            dock.innerHTML += `
                <button onclick="flyToDestination('${d.id}')" class="glass-pill px-3 py-1.5 rounded-full text-xs font-semibold text-slate-300 hover:text-cyan-300 hover:border-cyan-400/50 transition-all shrink-0 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span> ${d.name}
                </button>
            `;
        });

        function handleSearch(query) {
            const results = document.getElementById('search-results');
            if (!query.trim()) {
                results.classList.add('hidden');
                return;
            }
            const filtered = destinations.filter(d => d.name.toLowerCase().includes(query.toLowerCase()) || d.country.toLowerCase().includes(query.toLowerCase()));
            results.innerHTML = filtered.map(d => `
                <div onclick="flyToDestination('${d.id}'); document.getElementById('search-results').classList.add('hidden')" class="p-2 rounded-xl hover:bg-cyan-500/20 cursor-pointer flex items-center justify-between text-xs">
                    <span class="font-bold text-white">${d.name}, ${d.country}</span>
                    <i data-lucide="arrow-up-right" class="w-3.5 h-3.5 text-cyan-400"></i>
                </div>
            `).join('');
            results.classList.remove('hidden');
            lucide.createIcons();
        }

        // Drawer Engine
        async function openDrawer(id) {
            const d = destinations.find(item => item.id === id);
            if (!d) return;

            window.activeDestId = id;
            document.getElementById('drawer-img').src = d.img;
            document.getElementById('drawer-country').innerText = d.country;
            document.getElementById('drawer-title').innerText = d.name;
            document.getElementById('drawer-desc').innerText = d.desc;
            document.getElementById('drawer-currency').innerText = d.currency;
            document.getElementById('drawer-season').innerText = d.season;

            const rate = exchangeRates[currentCurrency];
            const sym = currencySymbols[currentCurrency];
            document.getElementById('drawer-price').innerText = `${sym}${Math.round(d.price * rate)}/nt`;

            const highlightsContainer = document.getElementById('drawer-highlights');
            highlightsContainer.innerHTML = d.highlights.map(h => `
                <div class="glass-panel p-2.5 rounded-xl border border-white/5 text-[11px] text-slate-300 flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-3.5 h-3.5 text-cyan-400 shrink-0"></i> <span>${h}</span>
                </div>
            `).join('');

            document.getElementById('btn-book-hotels').onclick = () => openBookingModal(d.name);
            document.getElementById('btn-book-flights').onclick = () => openBookingModal(d.name);

            lucide.createIcons();
            document.getElementById('fact-drawer').classList.remove('translate-x-full');

            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${d.lat}&longitude=${d.lng}&current_weather=true`);
                const weatherData = await res.json();
                const tempC = Math.round(weatherData.current_weather.temperature);
                document.getElementById('weather-temp').innerText = `${tempC}°C / ${Math.round(tempC * 9/5 + 32)}°F`;
                document.getElementById('weather-cond').innerText = `Windspeed: ${weatherData.current_weather.windspeed} km/h • Coordinates ${d.lat.toFixed(1)}°N`;
            } catch (e) {
                document.getElementById('weather-temp').innerText = `22°C`;
                document.getElementById('weather-cond').innerText = `Optimal travel conditions`;
            }
        }

        function closeDrawer() {
            document.getElementById('fact-drawer').classList.add('translate-x-full');
        }

        function openBookingModal(destName) {
            document.getElementById('booking-modal-title').innerText = `Book ${destName}`;
            document.getElementById('link-booking-com').href = `https://www.booking.com/searchresults.html?ss=${encodeURIComponent(destName)}`;
            document.getElementById('link-skyscanner').href = `https://www.skyscanner.net/transport/flights/anywhere/${encodeURIComponent(destName.toLowerCase())}/`;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function closeBookingModal() {
            document.getElementById('booking-modal').classList.add('hidden');
        }

        // -------------------------------------------------------------
        // Three.js WebGL Procedural 3D Earth Engine
        // -------------------------------------------------------------
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x030712, 1.0);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.minDistance = 2.0;
        controls.maxDistance = 7.0;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;

        const globeRadius = 1.4;

        // Generate Procedural High-Res Earth Blue Marble Canvas Texture
        function createProceduralEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Ocean gradient background
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#020b18');
            grad.addColorStop(0.5, '#0a2540');
            grad.addColorStop(1, '#020b18');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 512);

            // Latitude / Longitude map grid lines
            ctx.strokeStyle = 'rgba(0, 210, 255, 0.15)';
            ctx.lineWidth = 1;
            for (let x = 0; x < 1024; x += 64) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
            }
            for (let y = 0; y < 512; y += 32) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
            }

            // Draw Continents approximation shapes
            ctx.fillStyle = 'rgba(0, 210, 255, 0.35)';
            
            // Americas
            ctx.beginPath(); ctx.ellipse(280, 200, 110, 90, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(330, 340, 70, 110, 0, 0, Math.PI * 2); ctx.fill();

            // Europe / Africa
            ctx.beginPath(); ctx.ellipse(540, 160, 60, 50, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(560, 290, 75, 95, 0, 0, Math.PI * 2); ctx.fill();

            // Asia / Australia
            ctx.beginPath(); ctx.ellipse(750, 180, 140, 90, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(840, 360, 60, 50, 0, 0, Math.PI * 2); ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        // Earth Base Mesh
        const earthGeo = new THREE.SphereGeometry(globeRadius, 64, 64);
        const earthMat = new THREE.MeshStandardMaterial({
            map: createProceduralEarthTexture(),
            roughness: 0.6,
            metalness: 0.2
        });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earthMesh);

        // Try downloading realistic texture over textureLoader with procedural fallback
        const textureLoader = new THREE.TextureLoader();
        textureLoader.crossOrigin = 'anonymous';
        textureLoader.load(
            'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
            (tex) => {
                earthMat.map = tex;
                earthMat.needsUpdate = true;
            },
            undefined,
            (err) => { console.warn('Using procedural Earth shader fallback.'); }
        );

        // Atmosphere Glow Outer Shell
        const atmosGeo = new THREE.SphereGeometry(globeRadius + 0.08, 64, 64);
        const atmosMat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(0x00d2ff),
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        scene.add(new THREE.Mesh(atmosGeo, atmosMat));

        // Lighting Setup
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        // Lat/Lng to Vector3 Math
        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -(radius * Math.sin(phi) * Math.cos(theta)),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // Pins Container
        const markersGroup = new THREE.Group();
        scene.add(markersGroup);

        const pinMeshes = [];
        const markerMap = new Map();

        destinations.forEach(d => {
            const pos = latLngToVector3(d.lat, d.lng, globeRadius + 0.01);

            // Glowing Pin Dot
            const pinGeo = new THREE.SphereGeometry(0.028, 16, 16);
            const pinMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
            const pinMesh = new THREE.Mesh(pinGeo, pinMat);
            pinMesh.position.copy(pos);
            pinMesh.userData = { id: d.id };

            // Pulse Ring
            const ringGeo = new THREE.RingGeometry(0.03, 0.05, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.position.copy(pos);
            ringMesh.lookAt(new THREE.Vector3(0, 0, 0));

            markersGroup.add(pinMesh);
            markersGroup.add(ringMesh);

            pinMeshes.push(pinMesh);
            markerMap.set(d.id, pos);
        });

        // Click Raycasting Engine
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pinMeshes);

            if (intersects.length > 0) {
                const targetId = intersects[0].object.userData.id;
                if (targetId) flyToDestination(targetId);
            }
        });

        // Flight Animation
        function flyToDestination(id) {
            const targetPos = markerMap.get(id);
            if (!targetPos) return;

            openDrawer(id);

            controls.autoRotate = false;
            document.getElementById('rotate-btn').innerHTML = `<i data-lucide="play" class="w-4 h-4"></i>`;
            lucide.createIcons();

            const targetCamPos = targetPos.clone().multiplyScalar(2.2);
            const startCamPos = camera.position.clone();
            const startTime = performance.now();
            const duration = 1600;

            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 0.5 - Math.cos(progress * Math.PI) / 2;

                camera.position.lerpVectors(startCamPos, targetCamPos, ease);
                controls.update();

                if (progress < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        function toggleAutoRotate() {
            controls.autoRotate = !controls.autoRotate;
            const btn = document.getElementById('rotate-btn');
            btn.innerHTML = controls.autoRotate ? `<i data-lucide="pause" class="w-4 h-4"></i>` : `<i data-lucide="play" class="w-4 h-4"></i>`;
            lucide.createIcons();
        }

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Canvas Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
